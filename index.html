<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Coins Game</title>
    <style>
        /* ... (same as before) */
        #play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #store-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #4CAF50;
            color: #fff;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #store {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        #store button {
            background-color: #4CAF50;
            color: #fff;
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- ... (same as before) -->
        <button id="play-button">Play</button>
        <button id="store-button">Store</button>
        <div id="store">
            <h2>Store</h2>
            <p>Bucket Skins:</p>
            <button>Buy Skin 1 (10 coins)</button>
            <button>Buy Skin 2 (20 coins)</button>
            <p>Coins:</p>
            <button>Buy 100 coins (10 diamonds)</button>
            <button>Buy 500 coins (50 diamonds)</button>
        </div>
    </div>
    <script>
        // ... (same as before)
        let gameMode = 'easy';
        let speed = 2;
        let coins = 0;
        let diamonds = 0;
        let basketSkins = [];
        let currentSkin = 0;
        let playButton = document.getElementById('play-button');
        let storeButton = document.getElementById('store-button');
        let store = document.getElementById('store');
        playButton.addEventListener('click', startGame);
        storeButton.addEventListener('click', toggleStore);
        function startGame() {
            gameActive = true;
            gameMode = 'easy';
            speed = 2;
            coins = 0;
            diamonds = 0;
            basketSkins = [];
            currentSkin = 0;
            updateCoins();
            createCoin();
            setInterval(createCoin, 800);
        }
        function toggleStore() {
            store.style.display = store.style.display === 'none' ? 'block' : 'none';
        }
        function buySkin(skinNumber) {
            if (coins >= 10) {
                coins -= 10;
                basketSkins.push(skinNumber);
                currentSkin = skinNumber;
                updateBasketSkin();
            }
        }
        function buyCoins(amount) {
            if (diamonds >= 10) {
                diamonds -= 10;
                coins += amount;
            }
        }
        function updateBasketSkin() {
            basket.style.background = `url('skin${currentSkin}.png')`;
        }
        function updateCoins() {
            scoreElement.textContent = coins;
        }
        // ... (same as before)
    </script>
</body>
</html>
