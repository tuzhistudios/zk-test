<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZarKos AI – I Do + System</title>
  <style>
    :root {
      --primary: #00f5ff;
      --accent: #ff00ff;
      --bg: #0a0a0a;
      --text: #fff;
      --dark: #111;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      transition: background 0.4s ease;
    }

    .sky {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--primary) 0%, var(--bg) 70%);
      animation: pulse 8s infinite alternate;
    }

    @keyframes pulse {
      0% { filter: brightness(1); }
      100% { filter: brightness(1.4); }
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      animation: float 15s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1); opacity: 0; }
    }

    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      padding: 1.2rem 2rem;
      align-items: center;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      color: transparent;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary); }
      to { text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent); }
    }

    .lang-toggle {
      cursor: pointer;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .lang-toggle:hover {
      background: var(--accent);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 0 1rem;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      animation: slideIn 1s ease-out;
    }

    p {
      font-size: 1.2rem;
      max-width: 700px;
      margin-bottom: 2rem;
      line-height: 1.6;
      animation: fadeUp 1.2s ease-out;
    }

    .cta {
      display: inline-block;
      padding: 0.9rem 2rem;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border: none;
      border-radius: 30px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .cta:hover {
      transform: scale(1.1);
    }

    @keyframes slideIn {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .footer {
      padding: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.5rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>

  <header>
    <div class="logo">ZarKos AI</div>
    <button class="lang-toggle" id="langBtn">हिंदी</button>
  </header>

  <main>
    <h1 id="title">I Do + System</h1>
    <p id="desc">
      Meet ZarKos AI — an autonomous, ultra-fast assistant built by TuZhi Studio. Hindi & English ready, code-gen, design, and logic — all in one. Experience the future, now.
    </p>
    <button class="cta" id="ctaBtn">Get Started</button>
  </main>

  <footer class="footer">
    © 2024 TuZhi Studio
  </footer>

  <script>
    // Language toggle
    const data = {
      en: {
        title: "I Do + System",
        desc: "Meet ZarKos AI — an autonomous, ultra-fast assistant built by TuZhi Studio. Hindi & English ready, code-gen, design, and logic — all in one. Experience the future, now.",
        cta: "Get Started"
      },
      hi: {
        title: "मैं करूँ + सिस्टम",
        desc: "ZarKos AI से मिलिए — TuZhi Studio का स्वचालित, अल्ट्रा-फास्ट असिस्टेंट। हिंदी और इंग्लिश में समर्थित, कोड-जेन, डिज़ाइन व लॉजिक — सब एक में। भविष्य अभी अनुभव करें।",
        cta: "शुरू करें"
      }
    };

    const langBtn = document.getElementById("langBtn");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const ctaBtn = document.getElementById("ctaBtn");
    let currentLang = "en";

    langBtn.addEventListener("click", () => {
      currentLang = currentLang === "en" ? "hi" : "en";
      title.textContent = data[currentLang].title;
      desc.textContent = data[currentLang].desc;
      ctaBtn.textContent = data[currentLang].cta;
      langBtn.textContent = currentLang === "en" ? "हिंदी" : "English";
    });

    // Animated particles
    const particleCount = 70;
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement("div");
      p.classList.add("particle");
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = Math.random() * 10 + 5 + "s";
      p.style.animationDelay = Math.random() * 5 + "s";
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
