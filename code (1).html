<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuZhi Codes</title>
<style>
/* ====== RESET & BASE ====== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
html,body{
    height:100%;
}
body{
    background:#000;
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* ====== MAIN TITLE ====== */
.title{
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight:800;
    letter-spacing:4px;
    text-transform:uppercase;
    background:linear-gradient(90deg, #FF8C00 0%, #FFD700 50%, #FF8C00 100%);
    background-size:200% auto;
    -webkit-background-clip:text;
            background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
    text-shadow:0 0 40px rgba(255,165,0,.6);
}

@keyframes shine{
    to{background-position:200% center;}
}

/* ====== SUBTITLE ====== */
.subtitle{
    margin-top:1rem;
    font-size:1.4rem;
    opacity:.8;
    letter-spacing:2px;
}

/* ====== GLOW LINE ====== */
.glow-line{
    width:250px;
    height:4px;
    margin:2rem auto;
    background:linear-gradient(90deg, transparent, #FFA500, transparent);
    border-radius:2px;
    animation:pulse 2s ease-in-out infinite alternate;
}
@keyframes pulse{
    to{width:350px; opacity:.4;}
}

/* ====== FLOATING DOTS ====== */
.dots{
    position:absolute;
    inset:0;
    z-index:-1;
}
.dot{
    position:absolute;
    width:100px;
    height:100px;
    background:radial-gradient(circle, rgba(255,165,0,.15) 0%, transparent 70%);
    border-radius:50%;
    animation:float 20s infinite linear;
}
@keyframes float{
    0%{transform:translate(0,0);}
    25%{transform:translate(20px,-30px);}
    50%{transform:translate(-20px,20px);}
    75%{transform:translate(30px,10px);}
    100%{transform:translate(0,0);}
}
</style>
</head>
<body>
    <div class="dots" id="dots"></div>

    <section>
        <h1 class="title">TuZhi Codes</h1>
        <div class="glow-line"></div>
        <p class="subtitle">Coding with Passion & Precision</p>
    </section>

<script>
/* ====== RANDOM FLOATING DOTS ====== */
const box=document.getElementById('dots');
for(let i=0;i<18;i++){
    const d=document.createElement('div');
    d.className='dot';
    d.style.top=Math.random()*100+'%';
    d.style.left=Math.random()*100+'%';
    d.style.width=d.style.height=(Math.random()*80+40)+'px';
    d.style.animationDelay=Math.random()*20+'s';
    box.appendChild(d);
}
</script>
</body>
</html>
